[pytest]
# Sem isto, `pytest` sozinho varre a pasta inteira e tenta coletar o que estiver
# em `data/` — que é onde ficam os arquivos de execução, inclusive as sobras de
# `--basetemp` de sessões antigas. A coleta morre com erro de permissão antes de
# rodar o primeiro teste, o que faz parecer que a suíte quebrou.
testpaths = tests
norecursedirs = data .venv
